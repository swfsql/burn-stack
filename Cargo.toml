# burn-cubecl = { path = "../burn/crates/burn-cubecl", default-features = false, optional = true }
# burn-fusion = { path = "../burn/crates/burn-fusion", default-features = false, optional = true }

[dev-dependencies]
### For the main branch. ###
# burn = { version = "0.22.0-pre.3", default-features = false, features = ["autodiff", "std", "optim", "extension"]}
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, features = ["autodiff", "std", "optim", "extension"]}

### For local development. ###
# burn = { path = "../burn/crates/burn", default-features = false, features = ["autodiff", "std"] }

# tracel-ai/burn#5772 ("Related: a capture needs ~3x a pass's memory"): burn and
# cubecl at the pinned revs plus one line each — burn's `capture` primes only
# its last warm-up, cubecl pins only what the recording touched — so a captured
# graph holds one pass's memory instead of three. Every burn and cubecl crate in
# the dependency graph is patched (a missing one links a second copy).
[patch."https://github.com/tracel-ai/burn.git"]
burn = { git = "https://github.com/swfsql/burn.git", rev = "143bff617c988bdd3245fe0093f789fbdc5585cb" }
