[package]
name = "burn-stack"
version = "0.20.0"
edition = "2024"
description = "Block-generic layer/network composition on Burn: Pre-LN layers, virtual-layer stacks, bidirectional pairs, latent/vocab networks, multi-gate residuals, class tokens, and Muon parameter groups."

[features]
default = ["autodiff", "optim", "backend-flex"]
autodiff = ["burn/autodiff"]
# Optimizer support (`crate::optim`): Muon parameter groups over the fused
# projections. Pulls `burn-optim` (which implies `burn/autodiff`).
optim = ["burn/optim", "burn/std", "autodiff"]
cubecl = ["dep:burn-cubecl", "burn/cubecl"]
fusion = ["burn/fusion", "dep:burn-fusion"]
check-inf = []
check-nan = []
# Expose `examples::*` — the CLI / training-config / MNIST scaffolding the
# consumer crates' `examples/` directories share. Example-only surface, off by
# default; enable it from a consumer's **dev**-dependencies.
examples-common = [
    "optim",
    "burn/train",
    "burn/dataset",
    "dep:burn-dataset",
    "dep:dirs",
    "dep:flate2",
    "dep:image",
    "dep:parquet",
    "dep:pico-args",
    "dep:rand",
    "dep:rand_chacha",
    "dep:temp-dir",
]
# Expose `utils::test_helpers` (and its `check_grads_match_two_paths!` macro) to
# downstream dev-dependencies. Test-only surface; off by default.
test-helpers = []
# Backend selection. With the Dispatch architecture each feature simply enables
# the corresponding burn backend; multiple may be compiled in simultaneously.
# At runtime the tests use `Device::default()`, which resolves to an enabled
# backend (honouring the `BURN_DEVICE` env override). Each backend also turns on
# the internal `_dev-test` marker so the tensor test suite compiles under
# whichever backend is present.
backend-ndarray = ["burn/ndarray", "_dev-test"]
backend-ndarray-blas-accelerate = ["backend-ndarray", "burn/std", "burn/accelerate"]
backend-ndarray-blas-netlib = ["backend-ndarray", "burn/std", "burn/blas-netlib"]
backend-ndarray-blas-openblas = ["backend-ndarray", "burn/std", "burn/openblas"]
backend-flex = ["burn/flex", "_dev-test"]
backend-flex-rayon = ["backend-flex", "dep:burn-flex", "burn-flex?/rayon"]
backend-cpu = ["burn/cpu", "burn/std", "cubecl", "_dev-test"]
backend-tch-cpu = ["burn/tch", "burn/std", "_dev-test"]
backend-tch-gpu = ["burn/tch", "burn/std", "_dev-test"]
backend-wgpu = ["burn/wgpu", "burn/std", "cubecl", "_dev-test"]
backend-webgpu = ["burn/webgpu", "burn/std", "cubecl", "_dev-test"]
backend-metal = ["burn/metal", "burn/std", "cubecl", "_dev-test"]
backend-vulkan = ["burn/vulkan", "burn/std", "cubecl", "_dev-test"]
backend-cuda = ["burn/cuda", "burn/std", "cubecl", "_dev-test"]
backend-rocm = ["burn/rocm", "burn/std", "cubecl", "_dev-test"]
backend-remote = ["burn/remote", "burn/std", "cubecl", "_dev-test"]
# `_dev-test` (internal): enabled by every `backend-*` so the tensor test suite
# compiles whenever a backend is present. Not meant to be enabled directly.
_dev-test = []
dev-f16 = []
dev-simd = ["burn/simd", "burn/std"]
dev-autotune = ["burn/autotune"]

[dependencies]
serde = { version = "1.0.0", features = ["derive"] }
# `examples-common` only.
dirs = { version = "6.0.0", optional = true }
flate2 = { version = "1.1.4", optional = true }
image = { version = "0.25.10", optional = true }
# the character LM's corpus is one ZSTD parquet file; `arrow` (the default) is
# a whole columnar stack this crate has no use for, so only the codec is on.
parquet = { version = "59.3.0", default-features = false, features = ["zstd"], optional = true }
pico-args = { version = "0.5.0", features = ["eq-separator", "combined-flags"], optional = true }
rand = { version = "0.9.2", optional = true }
rand_chacha = { version = "0.9.0", optional = true }
temp-dir = { version = "0.1.16", optional = true }
# burn-flex = { version = "0.22.0-pre.3", default-features = false, optional = true }
burn-flex = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, optional = true }

### For the main branch. ###
# burn = { version = "0.22.0-pre.3", default-features = false, features = ["extension"]}
# burn-cubecl = { version = "0.22.0-pre.3", default-features = false, optional = true}
# burn-fusion = { version = "0.22.0-pre.3", default-features = false, optional = true}
# `examples-common` only: the MNIST download path.
# burn-dataset = { version = "0.22.0-pre.3", features = ["network"], optional = true }
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, features = ["extension"] }
burn-cubecl = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, optional = true}
burn-fusion = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, optional = true}
burn-dataset = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", features = ["network"], optional = true }

### For local development. ###
